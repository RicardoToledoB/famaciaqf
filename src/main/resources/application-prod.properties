# Perfil de produccion para farmaciaqf-api.dssm.cl
# Ejecutar con: java -jar target/v1-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod

spring.datasource.url=jdbc:mysql://localhost:3306/farmaciaqf?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=farmaciaqf_user
spring.datasource.password=CAMBIAR_CLAVE_MYSQL_SERVIDOR

server.port=8080
server.forward-headers-strategy=framework

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

app.jwt.secret=CAMBIAR_SECRET_JWT_LARGO_SEGURO_PRODUCCION_FARMACIAQF_DSSM_2026_1234567890
app.jwt.expiration-ms=3600000
