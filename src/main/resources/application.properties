spring.application.name=farmaciaqf-api

# ==========================
# Base de datos MySQL LOCAL
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/farmaciaqf?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=farmaciaqf_user
spring.datasource.password=FarmaciaQF_2026$

# ==========================
# Puerto de servidor
# ==========================
server.port=8889
server.forward-headers-strategy=framework

# ==========================
# Swagger
# ==========================
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# ==========================
# Logs
# ==========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.security=DEBUG

# ==========================
# JWT
# ==========================
app.jwt.secret=FarmaciaQF_DSSM_2026_SECRET_LOCAL_CAMBIAR_EN_PRODUCCION_1234567890
app.jwt.expiration-ms=3600000
